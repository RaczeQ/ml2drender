[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "ml2drender"
description = "MapLibre style 2D renderer in pure Rust, no GPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<1", "certifi>=2026.10.19"]
license = { text = "BSD-3-Clause" }
dynamic = ["version"]
classifiers = [
    "Framework :: Matplotlib",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Kanahiro/ml2drender"
Documentation = "https://github.com/Kanahiro/ml2drender/tree/main/crates/python"
Demo = "https://kanahiro.github.io/ml2drender/"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff==0.17.4"]
# For ml2drender.basemap's tests: not dependencies of the package, which asks for them when used.
test = ["matplotlib>=3.11.2", "pyproj>=3.7.2"]

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.maturin]
# Panics unwind into Python exceptions; x86-64 builds target x86-64-v2 (../../.cargo/config.toml).
profile = "native"
module-name = "ml2drender._native"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc"]
